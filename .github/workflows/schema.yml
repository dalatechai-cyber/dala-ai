# Everything this repository can check without a live Supabase, Meta app or QStash:
# the schema against a real PostgreSQL, the four guards, typecheck, the unit tests,
# and the build.
#
# ## Runs on EVERY pull request, deliberately — no `paths:` filter
#
# There used to be one: ['supabase/**', 'scripts/**', '.github/workflows/schema.yml'].
# It predated `src/`, so once product code arrived this workflow silently stopped
# running on the PRs that changed it. The Track 1 PR ran only because it happened to
# edit this very file; the Track 2 PR touched `src/` alone and got NO runs at all —
# and a pull request with zero runs shows no red, so it reads as fine.
#
# That is the same shape as the bake-off gate tests that skipped green: a check that
# appears to gate and does not. The cost of running too broadly is a few seconds of
# runner time. The cost of running too narrowly is unguarded code merging green.
# Those are not comparable, so there is no filter.
name: verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector image so 0002 is exercised too, rather than assumed.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          # C.UTF-8, never C/POSIX: lower() on Cyrillic under C returns the string
          # unchanged, silently. V0 asserts this, so getting it wrong here fails.
          POSTGRES_INITDB_ARGS: '--locale=C.UTF-8'
        ports: ['5432:5432']
        # -U postgres, not bare pg_isready: the probe otherwise connects as the
        # runner's OS user (root), which does not exist in the cluster. It still
        # reports the server up — pg_isready treats an auth error as "responding" —
        # so the gate passes while logging FATAL three times. A readiness check that
        # is green for the wrong reason is the thing this repository keeps finding.
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Install psql client
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Apply migrations and run all three suites
        run: ./scripts/verify/run-all.sh dala_ci

      - name: Bake-off gate unit tests
        # Runs against a synthetic prefix, so it needs no ancestor checkout and
        # actually executes here. The first version cloned Matrix-Chatbot, which is
        # private — the clone failed and every run skipped with a warning nobody
        # read. real-prefix.test.mjs still checks the fixture against the ancestor
        # and reports a skip as a skip when it is unavailable.
        run: node --test "scripts/bakeoff/test/*.test.mjs"

      - name: Install app dependencies
        run: npm ci

      - name: Guards (all eight — see package.json `guard`)
        run: npm run guard

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: node --test "src/**/*.test.ts" "scripts/**/*.test.ts" "scripts/bakeoff/test/*.test.mjs"

      - name: Credential round-trip against PostgreSQL
        # The unit tests seal and open in memory; this one stores the row, reads it back
        # in the shape PostgREST serialises bytea in, and decrypts it through the runtime
        # loader. It also runs scripts/kek/seal.ts as a subprocess, so what is exercised is
        # the command an operator would actually type.
        #
        # The KEK is generated for this run and never persisted. It proves the mechanism,
        # not a credential — nothing here touches a Supabase project or a real token.
        run: |
          export TENANT_KEK_V1="$(node scripts/kek/generate.ts)"
          export TENANT_KEK_ACTIVE_VERSION=v1
          node scripts/verify/secret-roundtrip.ts dala_ci

      - name: Build
        run: npx next build

      - name: Boot smoke — a real server, over HTTP
        # The only step that starts Next.js and speaks HTTP to it. Everything else here is
        # a unit test or a database check, and neither can see the layer where a route is
        # correct and still never runs: a middleware matcher that swallows the path, an env
        # accessor that throws at module scope, a body read that decodes bytes as text.
        #
        # Every credential it uses is a placeholder and the registry points at a closed
        # local port, so nothing reaches Meta, Supabase, Anthropic or QStash.
        run: ./scripts/verify/boot-smoke.sh

      - name: Confirm the schema is on PostgreSQL, not on trust
        if: always()
        run: psql -d postgres -tAc "select version();"
