# Answers DalaTech's test set with the real model over the live configuration dumped in
# scripts/bakeoff/dalatech-live.json, through the production reply path, and prints every reply
# to this run's log and summary.
#
# IT SPENDS REAL MONEY (Sonnet 5, about $1.50 a run; the repeat set about $1.50 more), so it runs
# ONLY when started by hand (Actions → Test set (DalaTech) → Run workflow). Founder, 2026-09-26
# (D-137): *"No paid model runs for testing … unless I explicitly start one."* No push, tag or
# commit message starts it any more. Needs the ANTHROPIC_API_KEY repository secret.
# Nothing is written anywhere: the dump is served by a read-only fixture, and testset.ts
# refuses a dump whose prompt does not hash to its own content_hash.
name: Test set (DalaTech)

on:
  workflow_dispatch:
    inputs:
      repeat:
        description: Also answer the gate repeat set (every active case three times) — about $1.50 more
        type: boolean
        default: false

jobs:
  testset:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Answer the set
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          test -n "$ANTHROPIC_API_KEY" || { echo "ANTHROPIC_API_KEY secret is not set"; exit 2; }
          node scripts/bakeoff/testset.ts --dump scripts/bakeoff/dalatech-live.json --tag ci
      - name: Answer the salesperson set (D-132)
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/bakeoff/testset.ts --dump scripts/bakeoff/dalatech-live.json --set scripts/bakeoff/dalatech-sales-set.json --tag ci --max-calls 30
      - name: Answer the gate repeat set (D-134, every active case three times)
        if: always() && inputs.repeat
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/bakeoff/testset.ts --dump scripts/bakeoff/dalatech-live.json --set scripts/bakeoff/dalatech-gate-repeat-set.json --tag ci --max-calls 75 --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - name: Report
        if: always()
        run: |
          cat docs/reports/dalatech-testset.md
          cat docs/reports/dalatech-testset.md >> "$GITHUB_STEP_SUMMARY"
          cat docs/reports/dalatech-sales-testset.md || true
          cat docs/reports/dalatech-sales-testset.md >> "$GITHUB_STEP_SUMMARY" || true
          cat docs/reports/dalatech-gate-repeat.md || true
          cat docs/reports/dalatech-gate-repeat.md >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testset-dalatech
          path: |
            scripts/bakeoff/runs/testset-dalatech-ci.json
            docs/reports/dalatech-testset.md
            docs/reports/dalatech-sales-testset.md
            docs/reports/dalatech-gate-repeat.md
          if-no-files-found: warn
